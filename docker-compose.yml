services:
  postgres:
    image: postgres:16-alpine
    container_name: xsf_postgres
    environment:
      POSTGRES_USER: xsf
      POSTGRES_PASSWORD: xsf_local
      POSTGRES_DB: xsf
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - xsf_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xsf -d xsf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xsf_redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6381:6379"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: xsf_mailpit
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

volumes:
  xsf_postgres:
