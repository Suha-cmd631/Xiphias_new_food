# Production stack for one small server. Start with:  ./deploy/deploy.sh
# Settings come from the .env file next to this one (copy deploy/production.env.example to .env).
name: xiphias

x-app: &app
  image: xiphias-app:latest
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *app
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_STRIPE_PK: ${NEXT_PUBLIC_STRIPE_PK:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_US_ORGANIC_OK: ${NEXT_PUBLIC_US_ORGANIC_OK:-}
        NEXT_PUBLIC_SHOW_TESTIMONIALS: ${NEXT_PUBLIC_SHOW_TESTIMONIALS:-}
    working_dir: /app/apps/web
    command: ["node_modules/.bin/next", "start", "-p", "3000", "-H", "0.0.0.0"]
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *app
    pull_policy: never
    working_dir: /app/apps/api
    command: ["node", "dist/src/index.js"]
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # Visitor -> Caddy -> website -> API. Caddy writes the visitor's real IP into X-Forwarded-For.
      TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    pull_policy: never
    working_dir: /app/apps/api
    command: ["node", "dist/src/worker.js"]
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
